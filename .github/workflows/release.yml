name: Release

# Every push to `main` is checked; if the version in Cargo.toml has not been
# released yet, it is tagged and published with its packages.
# To release: bump `version` in Cargo.toml (and Cargo.lock), add the matching
# section to CHANGELOG.md on `test`, and merge `test` into `main`.
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RUST_VERSION: "1.99.1" # keep in step with ci.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip_package: true

  release:
    name: Publish the release
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to know what was already released
      - name: Is this version new?
        id: version
        run: |
          version=$(scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version was already released. Bump the version in Cargo.toml and CHANGELOG.md to publish again."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: steps.version.outputs.new == 'true'
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
      - uses: dtolnay/rust-toolchain@master
        if: steps.version.outputs.new == 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.new == 'true'
      - uses: ./.github/actions/packaging-tools
        if: steps.version.outputs.new == 'true'
      - name: Build the packages
        if: steps.version.outputs.new == 'true'
        run: scripts/build-packages.sh
      - name: Install them, one distribution of each kind
        if: steps.version.outputs.new == 'true'
        # Nothing is published that did not install and run where it is meant to.
        run: |
          for image in debian:12 fedora:latest rockylinux:8 archlinux:latest; do
            scripts/distro-test.sh "$image"
          done
      - name: Publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" dist/* dist/.SRCINFO $prerelease \
            --target "$GITHUB_SHA" \
            --title "Queijo $VERSION" \
            --notes-file notes.md
